# NSI GENEVE ILB — use4-c, NIC3 (intrazone-traffic-inspection).
- name:
    explicit: nsi-izti-use4-c
  description: "NSI GENEVE ILB use4-c — Intrazone inspection NIC3 (memberless, zone coverage only)"
  project_id: rteller-demo-svc-e265-aaac
  region: us-east4
  network:
    explicit: nsi-data-producer-03
  subnetwork:
    explicit: izti-s1-use4
