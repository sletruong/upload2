# NSI GENEVE ILB — us-east4, zone b. Palo use4-b is the backend.
- name:
    explicit: nsi-use4-b
  description: "NSI GENEVE ILB us-east4-b — Palo Alto intercept endpoint"
  project_id: rteller-demo-svc-e265-aaac
  region: us-east4
  network:
    explicit: nsi-data-producer-01
  subnetwork:
    explicit: ewti-s1-use4
  address:
    explicit: nsi-vip-use4-b
  protocol: UDP
  ports: [6081]
  global_access: false
  health_check:
    protocol: HTTPS
    port: 443
    request_path: /unauth/php/health.php
    interval: 5
    healthy_threshold: 2
    unhealthy_threshold: 2
  nsi:
    join:
      explicit: adt-lab-nsi-fleet
    zone: us-east4-b
    description: "NSI zonal intercept deployment for us-east4-b"
