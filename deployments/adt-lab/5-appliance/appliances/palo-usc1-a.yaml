# # ⚠ Bundle3 image required for NSI. BYOL has no vm_series plugin → geneve-inspect
# # metadata is delivered but consumed by nothing → intercept silently fails.
# # ⚠ geneve-inspect:enable uses COLON (not =). The framework writes this once.
# # ⚠ n4d-standard-16 uses AMD EPYC (Genoa) — min_cpu_platform not required.
