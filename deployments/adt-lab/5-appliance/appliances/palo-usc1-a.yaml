# # Palo Alto VM-Series — us-central1, zone a.
# # NIC 0 = management (lan-mgmt-vpc). PAN-OS treats nic0 as management by default.
# # NIC 1 = east-west traffic inspection (ethernet1/1). NSI GENEVE arrives here.
# # NIC 2 = north-south traffic inspection (ethernet1/2).
# # NIC 3 = intrazone traffic inspection (ethernet1/3).
# # NIC 4 = interzone traffic inspection (ethernet1/4).
