# NCC RA spoke — Cisco WAN1 leg in us-east4.
- name:
    explicit: wan1-cisco-use4
  type: router_appliance
  description: "Cisco C8000v WAN1 RA spoke — us-east4"
  hub:
    explicit: wan1-ncc-hub
  group: default
  include_import_ranges: ["ALL_IPV4_RANGES"]
  cloud_router:
    router:
      explicit: cr-wan1-adt1-use4
    interfaces:
      - explicit: int-wan1-adt1-use4-0
      - explicit: int-wan1-adt1-use4-1
