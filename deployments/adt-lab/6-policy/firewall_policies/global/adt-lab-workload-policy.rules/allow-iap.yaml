# IAP admin path on the workload policy. Priority 1000 sits above all steering
# rules so admin SSH to workload VMs survives a broken Palo fleet.
1000:
  action: allow
  direction: INGRESS
  source_ranges: [35.235.240.0/20]
  layer4: [{ protocol: tcp, ports: ["22"] }]
  description: "allow SSH over IAP to workload VMs"
