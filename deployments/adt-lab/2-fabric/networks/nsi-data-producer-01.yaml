# East-West Traffic Inspection VPC — Palo Alto NIC 1 (data plane, NSI intercept endpoint).
# MTU 8896 for GENEVE encapsulation overhead (standard NSI requirement).
# AFTER_CLASSIC_FIREWALL: NSI relies on classic firewall + global network firewall
# policy in producer VPC; BEFORE ordering would break the intercept chain.
# Internal addresses: pre-reserved VIP addresses for NSI GENEVE ILBs (one per zone
# per region — the appliance_ilb module does data lookups for these by name).
- name:
    explicit: nsi-data-producer-01
  description: "East-West Traffic Inspection VPC - Palo NIC1 NSI GENEVE intercept, MTU 8896"
  mtu: 8896
  firewall_policy_enforcement_order: AFTER_CLASSIC_FIREWALL

  subnetworks:
    - name:
        explicit: ewti-s1-usc1
      region: us-central1
      ipv4_cidr: 192.168.31.0/24
      description: "East-West Inspection subnet us-central1 - Palo NIC1 data plane"
    - name:
        explicit: ewti-s1-use4
      region: us-east4
      ipv4_cidr: 192.168.131.0/24
      description: "East-West Inspection subnet us-east4 - Palo NIC1 data plane"
    - name:
        explicit: ewti-s1-usw2
      region: us-west2
      ipv4_cidr: 192.168.231.0/24
      description: "East-West Inspection subnet us-west2 - Palo NIC1 data plane"

  addresses:
    # NSI GENEVE ILB VIPs — one per zone per region.
    # The appliance_ilb module looks up these addresses by name at plan time.
    # Purpose SHARED_LOADBALANCER_VIP is required for internal load balancer frontends.
    - name:
        explicit: nsi-vip-usc1-a
      region: us-central1
      subnetwork:
        explicit: ewti-s1-usc1
      purpose: SHARED_LOADBALANCER_VIP
      address_type: INTERNAL
    - name:
        explicit: nsi-vip-usc1-b
      region: us-central1
      subnetwork:
        explicit: ewti-s1-usc1
      purpose: SHARED_LOADBALANCER_VIP
      address_type: INTERNAL
    - name:
        explicit: nsi-vip-usc1-c
      region: us-central1
      subnetwork:
        explicit: ewti-s1-usc1
      purpose: SHARED_LOADBALANCER_VIP
      address_type: INTERNAL
    - name:
        explicit: nsi-vip-use4-a
      region: us-east4
      subnetwork:
        explicit: ewti-s1-use4
      purpose: SHARED_LOADBALANCER_VIP
      address_type: INTERNAL
    - name:
        explicit: nsi-vip-use4-b
      region: us-east4
      subnetwork:
        explicit: ewti-s1-use4
      purpose: SHARED_LOADBALANCER_VIP
      address_type: INTERNAL
    - name:
        explicit: nsi-vip-use4-c
      region: us-east4
      subnetwork:
        explicit: ewti-s1-use4
      purpose: SHARED_LOADBALANCER_VIP
      address_type: INTERNAL
    - name:
        explicit: nsi-vip-usw2-a
      region: us-west2
      subnetwork:
        explicit: ewti-s1-usw2
      purpose: SHARED_LOADBALANCER_VIP
      address_type: INTERNAL
    - name:
        explicit: nsi-vip-usw2-b
      region: us-west2
      subnetwork:
        explicit: ewti-s1-usw2
      purpose: SHARED_LOADBALANCER_VIP
      address_type: INTERNAL
    - name:
        explicit: nsi-vip-usw2-c
      region: us-west2
      subnetwork:
        explicit: ewti-s1-usw2
      purpose: SHARED_LOADBALANCER_VIP
      address_type: INTERNAL
    # Palo Alto VM-Series data plane NIC1 — reserved per zone per region.
    - name:
        explicit: palo-usc1-a-ewti
      region: us-central1
      subnetwork:
        explicit: ewti-s1-usc1
      ipv4_address: 192.168.31.10
    - name:
        explicit: palo-usc1-b-ewti
      region: us-central1
      subnetwork:
        explicit: ewti-s1-usc1
      ipv4_address: 192.168.31.11
    - name:
        explicit: palo-usc1-c-ewti
      region: us-central1
      subnetwork:
        explicit: ewti-s1-usc1
      ipv4_address: 192.168.31.12
    - name:
        explicit: palo-use4-a-ewti
      region: us-east4
      subnetwork:
        explicit: ewti-s1-use4
      ipv4_address: 192.168.131.10
    - name:
        explicit: palo-use4-b-ewti
      region: us-east4
      subnetwork:
        explicit: ewti-s1-use4
      ipv4_address: 192.168.131.11
    - name:
        explicit: palo-usw2-a-ewti
      region: us-west2
      subnetwork:
        explicit: ewti-s1-usw2
      ipv4_address: 192.168.231.10
    - name:
        explicit: palo-usw2-b-ewti
      region: us-west2
      subnetwork:
        explicit: ewti-s1-usw2
      ipv4_address: 192.168.231.11

  firewall_rules:
    - name:
        explicit: fw-ewti-allow-healthcheck
      description: "Allow GCP health check probes to Palo Alto data plane NIC1 (TCP 22/443)"
      direction: INGRESS
      action: allow
      source_ranges:
        - 35.191.0.0/16
        - 130.211.0.0/22
        - 209.85.152.0/22
        - 209.85.204.0/22
      target_service_accounts:
        - sa-palo@rteller-demo-svc-e265-aaac.iam.gserviceaccount.com
      layer4:
        - protocol: tcp
          ports: ["22", "443"]
