# LAN Transit VPC — Cisco NIC 3 (GigabitEthernet4).
# No NCC VPC spoke — this VPC is an NCC RA spoke leg, not a VPC spoke member.
# Cloud Router NCC interfaces at 172.16.x.5/6 peer with Cisco Gi4.
- name:
    explicit: lan-transit-vpc1
  description: "LAN Transit VPC - Cisco C8K NIC3 + NCC RA spoke (LAN leg)"
  firewall_policy_enforcement_order: BEFORE_CLASSIC_FIREWALL

  subnetworks:
    - name:
        explicit: lan-transit-vpc1-s2-usc1
      region: us-central1
      ipv4_cidr: 172.16.1.0/24
      description: "LAN Transit primary subnet us-central1 - Cisco Gi4 + CR NCC interfaces"
    - name:
        explicit: lan-transit-vpc1-s2-use4
      region: us-east4
      ipv4_cidr: 172.16.101.0/24
      description: "LAN Transit primary subnet us-east4 - Cisco Gi4 + CR NCC interfaces"
    - name:
        explicit: lan-transit-vpc1-s2-usw2
      region: us-west2
      ipv4_cidr: 172.16.201.0/24
      description: "LAN Transit primary subnet us-west2 - Cisco Gi4 + CR NCC interfaces"

  routers:
    - name:
        explicit: cr-lan-transit-adt1-usc1
      region: us-central1
      bgp:
        asn: 65033
      interfaces:
        - name:
            explicit: int-lan-transit-adt1-usc1-0
          subnetwork:
            explicit: lan-transit-vpc1-s2-usc1
          private_address: 172.16.1.5
        - name:
            explicit: int-lan-transit-adt1-usc1-1
          subnetwork:
            explicit: lan-transit-vpc1-s2-usc1
          private_address: 172.16.1.6
          redundant_interface: int-lan-transit-adt1-usc1-0
    - name:
        explicit: cr-lan-transit-adt1-use4
      region: us-east4
      bgp:
        asn: 65034
      interfaces:
        - name:
            explicit: int-lan-transit-adt1-use4-0
          subnetwork:
            explicit: lan-transit-vpc1-s2-use4
          private_address: 172.16.101.5
        - name:
            explicit: int-lan-transit-adt1-use4-1
          subnetwork:
            explicit: lan-transit-vpc1-s2-use4
          private_address: 172.16.101.6
          redundant_interface: int-lan-transit-adt1-use4-0
    - name:
        explicit: cr-lan-transit-adt1-usw2
      region: us-west2
      bgp:
        asn: 65039
      interfaces:
        - name:
            explicit: int-lan-transit-adt1-usw2-0
          subnetwork:
            explicit: lan-transit-vpc1-s2-usw2
          private_address: 172.16.201.5
        - name:
            explicit: int-lan-transit-adt1-usw2-1
          subnetwork:
            explicit: lan-transit-vpc1-s2-usw2
          private_address: 172.16.201.6
          redundant_interface: int-lan-transit-adt1-usw2-0

  firewall_rules:
    - name:
        explicit: fw-lan-transit-allow-bgp
      description: "Allow BGP (TCP/179) between Cisco Gi4 and Cloud Router NCC interfaces"
      direction: INGRESS
      action: allow
      source_ranges:
        - 172.16.1.0/24
        - 172.16.101.0/24
        - 172.16.201.0/24
      layer4:
        - protocol: tcp
          ports: ["179"]

  addresses:
    # Cisco C8000v LAN NIC (Gi4) — reserved per zone pair per region.
    - name:
        explicit: cisco-usc1-a-lan
      region: us-central1
      subnetwork:
        explicit: lan-transit-vpc1-s2-usc1
      ipv4_address: 172.16.1.3
    - name:
        explicit: cisco-usc1-b-lan
      region: us-central1
      subnetwork:
        explicit: lan-transit-vpc1-s2-usc1
      ipv4_address: 172.16.1.4
    - name:
        explicit: cisco-use4-a-lan
      region: us-east4
      subnetwork:
        explicit: lan-transit-vpc1-s2-use4
      ipv4_address: 172.16.101.3
    - name:
        explicit: cisco-use4-b-lan
      region: us-east4
      subnetwork:
        explicit: lan-transit-vpc1-s2-use4
      ipv4_address: 172.16.101.4
    - name:
        explicit: cisco-usw2-a-lan
      region: us-west2
      subnetwork:
        explicit: lan-transit-vpc1-s2-usw2
      ipv4_address: 172.16.201.3
    - name:
        explicit: cisco-usw2-b-lan
      region: us-west2
      subnetwork:
        explicit: lan-transit-vpc1-s2-usw2
      ipv4_address: 172.16.201.4
