# LAN Management VPC — Cisco NIC 0 (Gi1) + Palo Alto NIC 0 (management).
# NCC VPC spoke joins lan-ncc-hub (mesh, default group).
# AFTER_CLASSIC_FIREWALL: management plane does not need hierarchical firewall override.
# Firewall: allow SSH/HTTP/HTTPS from known management CIDRs and IAP.
- name:
    explicit: lan-mgmt-vpc
  description: "LAN Mgmt VPC - Cisco Gi1 + Palo NIC0 management, NCC spoke"
  firewall_policy_enforcement_order: AFTER_CLASSIC_FIREWALL

  subnetworks:
    - name:
        explicit: lan-mgmt-vpc-s1-usc1
      region: us-central1
      ipv4_cidr: 192.168.21.0/24
      description: "LAN Mgmt VPC subnet us-central1 - appliance management NICs"
    - name:
        explicit: lan-mgmt-vpc-s1-use4
      region: us-east4
      ipv4_cidr: 192.168.121.0/24
      description: "LAN Mgmt VPC subnet us-east4 - appliance management NICs"
    - name:
        explicit: lan-mgmt-vpc-s1-usw2
      region: us-west2
      ipv4_cidr: 192.168.221.0/24
      description: "LAN Mgmt VPC subnet us-west2 - appliance management NICs"

  ncc_spokes:
    vpc:
      group: default
      name:
        explicit: lan-mgmt-vpc-spoke
      hub:
        explicit: lan-ncc-hub

  firewall_rules:
    - name:
        explicit: fw-mgmt-allow-mgmt-access
      description: "Allow SSH, HTTP, HTTPS from known management sources and IAP"
      direction: INGRESS
      action: allow
      source_ranges:
        - 104.53.251.27/32
        - 35.235.240.0/20
      layer4:
        - protocol: tcp
          ports: ["21", "22", "80", "443"]

  addresses:
    # Cisco C8000v management NIC (Gi1) — reserved per zone pair per region.
    - name:
        explicit: cisco-usc1-a-mgmt
      region: us-central1
      subnetwork:
        explicit: lan-mgmt-vpc-s1-usc1
      ipv4_address: 192.168.21.3
    - name:
        explicit: cisco-usc1-b-mgmt
      region: us-central1
      subnetwork:
        explicit: lan-mgmt-vpc-s1-usc1
      ipv4_address: 192.168.21.4
    - name:
        explicit: cisco-use4-a-mgmt
      region: us-east4
      subnetwork:
        explicit: lan-mgmt-vpc-s1-use4
      ipv4_address: 192.168.121.3
    - name:
        explicit: cisco-use4-b-mgmt
      region: us-east4
      subnetwork:
        explicit: lan-mgmt-vpc-s1-use4
      ipv4_address: 192.168.121.4
    - name:
        explicit: cisco-usw2-a-mgmt
      region: us-west2
      subnetwork:
        explicit: lan-mgmt-vpc-s1-usw2
      ipv4_address: 192.168.221.3
    - name:
        explicit: cisco-usw2-b-mgmt
      region: us-west2
      subnetwork:
        explicit: lan-mgmt-vpc-s1-usw2
      ipv4_address: 192.168.221.4
    # Palo Alto VM-Series management NIC (NIC0) — reserved per zone per region.
    - name:
        explicit: palo-usc1-a-mgmt
      region: us-central1
      subnetwork:
        explicit: lan-mgmt-vpc-s1-usc1
      ipv4_address: 192.168.21.10
    - name:
        explicit: palo-usc1-b-mgmt
      region: us-central1
      subnetwork:
        explicit: lan-mgmt-vpc-s1-usc1
      ipv4_address: 192.168.21.11
    - name:
        explicit: palo-usc1-c-mgmt
      region: us-central1
      subnetwork:
        explicit: lan-mgmt-vpc-s1-usc1
      ipv4_address: 192.168.21.12
    - name:
        explicit: palo-use4-a-mgmt
      region: us-east4
      subnetwork:
        explicit: lan-mgmt-vpc-s1-use4
      ipv4_address: 192.168.121.10
    - name:
        explicit: palo-use4-b-mgmt
      region: us-east4
      subnetwork:
        explicit: lan-mgmt-vpc-s1-use4
      ipv4_address: 192.168.121.11
    - name:
        explicit: palo-usw2-a-mgmt
      region: us-west2
      subnetwork:
        explicit: lan-mgmt-vpc-s1-usw2
      ipv4_address: 192.168.221.10
    - name:
        explicit: palo-usw2-b-mgmt
      region: us-west2
      subnetwork:
        explicit: lan-mgmt-vpc-s1-usw2
      ipv4_address: 192.168.221.11
