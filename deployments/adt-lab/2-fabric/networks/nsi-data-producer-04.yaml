# Interzone Traffic Inspection VPC — Palo Alto NIC 4.
# MTU 8896 for GENEVE encapsulation overhead.
# AFTER_CLASSIC_FIREWALL: consistent with other Palo Alto producer VPCs.
# Note: us-west2 uses 192.168.252.0/24 — the sequential next (261) exceeds octet range.
- name:
    explicit: nsi-data-producer-04
  description: "Interzone Traffic Inspection VPC - Palo NIC4 data plane, MTU 8896"
  mtu: 8896
  firewall_policy_enforcement_order: AFTER_CLASSIC_FIREWALL

  subnetworks:
    - name:
        explicit: ieti-s1-usc1
      region: us-central1
      ipv4_cidr: 192.168.61.0/24
      description: "Interzone Inspection subnet us-central1 - Palo NIC4 data plane"
    - name:
        explicit: ieti-s1-use4
      region: us-east4
      ipv4_cidr: 192.168.161.0/24
      description: "Interzone Inspection subnet us-east4 - Palo NIC4 data plane"
    - name:
        explicit: ieti-s1-usw2
      region: us-west2
      ipv4_cidr: 192.168.252.0/24
      description: "Interzone Inspection subnet us-west2 - Palo NIC4 data plane"

  addresses:
    # NSI GENEVE ILB VIPs — one per zone per region.
    - name:
        explicit: nsi-ieti-vip-usc1-a
      region: us-central1
      subnetwork:
        explicit: ieti-s1-usc1
      purpose: SHARED_LOADBALANCER_VIP
      address_type: INTERNAL
    - name:
        explicit: nsi-ieti-vip-usc1-b
      region: us-central1
      subnetwork:
        explicit: ieti-s1-usc1
      purpose: SHARED_LOADBALANCER_VIP
      address_type: INTERNAL
    - name:
        explicit: nsi-ieti-vip-usc1-c
      region: us-central1
      subnetwork:
        explicit: ieti-s1-usc1
      purpose: SHARED_LOADBALANCER_VIP
      address_type: INTERNAL
    - name:
        explicit: nsi-ieti-vip-use4-a
      region: us-east4
      subnetwork:
        explicit: ieti-s1-use4
      purpose: SHARED_LOADBALANCER_VIP
      address_type: INTERNAL
    - name:
        explicit: nsi-ieti-vip-use4-b
      region: us-east4
      subnetwork:
        explicit: ieti-s1-use4
      purpose: SHARED_LOADBALANCER_VIP
      address_type: INTERNAL
    - name:
        explicit: nsi-ieti-vip-use4-c
      region: us-east4
      subnetwork:
        explicit: ieti-s1-use4
      purpose: SHARED_LOADBALANCER_VIP
      address_type: INTERNAL
    - name:
        explicit: nsi-ieti-vip-usw2-a
      region: us-west2
      subnetwork:
        explicit: ieti-s1-usw2
      purpose: SHARED_LOADBALANCER_VIP
      address_type: INTERNAL
    - name:
        explicit: nsi-ieti-vip-usw2-b
      region: us-west2
      subnetwork:
        explicit: ieti-s1-usw2
      purpose: SHARED_LOADBALANCER_VIP
      address_type: INTERNAL
    - name:
        explicit: nsi-ieti-vip-usw2-c
      region: us-west2
      subnetwork:
        explicit: ieti-s1-usw2
      purpose: SHARED_LOADBALANCER_VIP
      address_type: INTERNAL
    # Palo Alto VM-Series data plane NIC4 — reserved per zone per region.
    - name:
        explicit: palo-usc1-a-ieti
      region: us-central1
      subnetwork:
        explicit: ieti-s1-usc1
      ipv4_address: 192.168.61.10
    - name:
        explicit: palo-usc1-b-ieti
      region: us-central1
      subnetwork:
        explicit: ieti-s1-usc1
      ipv4_address: 192.168.61.11
    - name:
        explicit: palo-usc1-c-ieti
      region: us-central1
      subnetwork:
        explicit: ieti-s1-usc1
      ipv4_address: 192.168.61.12
    - name:
        explicit: palo-use4-a-ieti
      region: us-east4
      subnetwork:
        explicit: ieti-s1-use4
      ipv4_address: 192.168.161.10
    - name:
        explicit: palo-use4-b-ieti
      region: us-east4
      subnetwork:
        explicit: ieti-s1-use4
      ipv4_address: 192.168.161.11
    - name:
        explicit: palo-usw2-a-ieti
      region: us-west2
      subnetwork:
        explicit: ieti-s1-usw2
      ipv4_address: 192.168.252.10
    - name:
        explicit: palo-usw2-b-ieti
      region: us-west2
      subnetwork:
        explicit: ieti-s1-usw2
      ipv4_address: 192.168.252.11

  firewall_rules:
    - name:
        explicit: fw-ieti-allow-healthcheck
      description: "Allow GCP health check probes to Palo Alto data plane NIC4 (TCP 22/443)"
      direction: INGRESS
      action: allow
      source_ranges:
        - 35.191.0.0/16
        - 130.211.0.0/22
        - 209.85.152.0/22
        - 209.85.204.0/22
      target_service_accounts:
        - sa-palo@rteller-demo-svc-e265-aaac.iam.gserviceaccount.com
      layer4:
        - protocol: tcp
          ports: ["22", "443"]
