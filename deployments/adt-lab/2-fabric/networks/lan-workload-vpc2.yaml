# LAN Workload VPC 2 — additional workload VPC. No NCC VPC spoke in original ADT-Lab config.
- name:
    explicit: lan-workload-vpc2
  description: "LAN Workload VPC2 - additional workload segmentation"
  firewall_policy_enforcement_order: BEFORE_CLASSIC_FIREWALL

  subnetworks:
    - name:
        explicit: lan-workload-vpc2-s1-usc1
      region: us-central1
      ipv4_cidr: 192.168.11.0/24
      description: "LAN Workload VPC2 primary subnet us-central1"
    - name:
        explicit: lan-workload-vpc2-s2-usc1
      region: us-central1
      ipv4_cidr: 192.168.12.0/24
      description: "LAN Workload VPC2 secondary subnet us-central1"
    - name:
        explicit: lan-workload-vpc2-s1-use4
      region: us-east4
      ipv4_cidr: 192.168.111.0/24
      description: "LAN Workload VPC2 primary subnet us-east4"
    - name:
        explicit: lan-workload-vpc2-s2-use4
      region: us-east4
      ipv4_cidr: 192.168.112.0/24
      description: "LAN Workload VPC2 secondary subnet us-east4"
    - name:
        explicit: lan-workload-vpc2-s1-usw2
      region: us-west2
      ipv4_cidr: 192.168.211.0/24
      description: "LAN Workload VPC2 primary subnet us-west2"
    - name:
        explicit: lan-workload-vpc2-s2-usw2
      region: us-west2
      ipv4_cidr: 192.168.212.0/24
      description: "LAN Workload VPC2 secondary subnet us-west2"
